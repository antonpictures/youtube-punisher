h1{position:absolute;left:24px;top:62px;font-size:30px;line-height:1.02;letter-spacing:-.02em}

p{position:absolute;left:24px;bottom:24px;font-size:12px;color:#bbb;max-width:360px}

<div class="target"></div><div class="target2"></div>
<span class="badge">CHROME EXTENSION</span>
